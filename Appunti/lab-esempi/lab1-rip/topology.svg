<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#ffffff;">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Kathara Logo -->
  
    <g transform="translate(30, 30)">
      <!-- Blue cube -->
      <polygon points="30,0 55,12 30,24 5,12" fill="#5dade2" stroke="#1b4f72" stroke-width="1.5"/>
      <polygon points="5,12 30,24 30,50 5,38" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
      <polygon points="30,24 55,12 55,38 30,50" fill="#1b4f72" stroke="#1b4f72" stroke-width="1.5"/>
      <!-- Orange cube -->
      <polygon points="68,14 82,21 68,28 54,21" fill="#f5b041" stroke="#b9770e" stroke-width="1.2"/>
      <polygon points="54,21 68,28 68,43 54,36" fill="#e59866" stroke="#b9770e" stroke-width="1.2"/>
      <polygon points="68,28 82,21 82,36 68,43" fill="#b9770e" stroke="#b9770e" stroke-width="1.2"/>
      <!-- Yellow cube -->
      <polygon points="20,44 40,54 20,64 0,54" fill="#f9e79f" stroke="#b7950b" stroke-width="1.5"/>
      <polygon points="0,54 20,64 20,84 0,74" fill="#f7dc6f" stroke="#b7950b" stroke-width="1.5"/>
      <polygon points="20,64 40,54 40,74 20,84" fill="#d4ac0d" stroke="#b7950b" stroke-width="1.5"/>
      <!-- Green cube -->
      <polygon points="56,38 80,50 56,62 32,50" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>
      <polygon points="32,50 56,62 56,86 32,74" fill="#7dcea0" stroke="#1e8449" stroke-width="1.5"/>
      <polygon points="56,62 80,50 80,74 56,86" fill="#229954" stroke="#1e8449" stroke-width="1.5"/>
    </g>
    

  <!-- Title in red (exact slide typography) -->
  <text x="240" y="85" fill="#ff0000" font-size="46" font-family="Arial, sans-serif" font-weight="normal">assigning ip numbers to interfaces</text>

  <!-- Yellow / Pale Orange Cloud for RIP Domain -->
  <path d="M 160 360 
           C 160 220, 280 180, 420 180 
           C 540 160, 680 180, 780 230 
           C 880 280, 880 440, 820 520 
           C 740 600, 520 620, 380 600 
           C 240 580, 160 500, 160 360 Z" 
        fill="#ffe8a1" fill-opacity="0.75" stroke="none"/>

  <!-- Link Lines (Solid thick black lines) -->
  <!-- LAN A bus line -->
  <line x1="200" y1="380" x2="340" y2="380" stroke="#000000" stroke-width="3.5"/>
  <!-- Link A to r1 -->
  <path d="M 270 380 C 270 300, 320 280, 370 280" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Link r1 to B -->
  <line x1="430" y1="280" x2="560" y2="380" stroke="#000000" stroke-width="3.5"/>
  <!-- Link B to r2 -->
  <line x1="560" y1="380" x2="680" y2="380" stroke="#000000" stroke-width="3.5"/>

  <!-- Link r2 to C -->
  <line x1="720" y1="380" x2="880" y2="380" stroke="#000000" stroke-width="3.5"/>
  <!-- Link C to rext -->
  <line x1="880" y1="380" x2="1020" y2="280" stroke="#000000" stroke-width="3.5"/>

  <!-- Dashed lines connecting subnet boxes to collision domains -->
  <line x1="220" y1="230" x2="220" y2="360" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="460" x2="560" y2="400" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="880" y1="230" x2="880" y2="360" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Subnet Boxes -->
  
    <g transform="translate(160, 205)">
      <rect x="0" y="0" width="128" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="64.0" y="18" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">100.1.1.0/24</text>
    </g>
    
  
    <g transform="translate(500, 460)">
      <rect x="0" y="0" width="128" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="64.0" y="18" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">100.1.0.0/30</text>
    </g>
    
  
    <g transform="translate(820, 205)">
      <rect x="0" y="0" width="128" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="64.0" y="18" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">100.2.0.0/30</text>
    </g>
    

  <!-- Collision Domains (Circles) -->
  
    <g transform="translate(220, 380)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <text x="0" y="7" fill="#000000" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">A</text>
    </g>
    
  
    <g transform="translate(560, 380)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <text x="0" y="7" fill="#000000" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">B</text>
    </g>
    
  
    <g transform="translate(880, 380)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <text x="0" y="7" fill="#000000" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">C</text>
    </g>
    

  <!-- Routers -->
  
    <g transform="translate(400, 260)" filter="url(#drop-shadow)">
      <!-- Cylinder side (body) -->
      <path d="M -40.0 0 L -40.0 20 A 40.0 20.0 0 0 0 40.0 20 L 40.0 0 Z" fill="#0052a3" stroke="#003366" stroke-width="1.5"/>
      <!-- Cylinder top ellipse -->
      <ellipse cx="0" cy="0" rx="40.0" ry="20.0" fill="#1a75ff" stroke="#003366" stroke-width="1.5"/>
      <!-- Router crossing arrows on top -->
      <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-18" y1="-4" x2="18" y2="4"/>
        <line x1="-18" y1="4" x2="18" y2="-4"/>
        <polyline points="-12,-8 -18,-4 -12,0"/>
        <polyline points="12,8 18,4 12,0"/>
        <polyline points="-12,8 -18,4 -12,0"/>
        <polyline points="12,-8 18,-4 12,0"/>
      </g>
      <!-- Router Name on front -->
      <text x="0" y="16" fill="#ffffff" font-size="18" font-family="'Arial Black', Arial, sans-serif" font-weight="900" text-anchor="middle">r1</text>
    </g>
    
  
    <g transform="translate(700, 360)" filter="url(#drop-shadow)">
      <!-- Cylinder side (body) -->
      <path d="M -40.0 0 L -40.0 20 A 40.0 20.0 0 0 0 40.0 20 L 40.0 0 Z" fill="#0052a3" stroke="#003366" stroke-width="1.5"/>
      <!-- Cylinder top ellipse -->
      <ellipse cx="0" cy="0" rx="40.0" ry="20.0" fill="#1a75ff" stroke="#003366" stroke-width="1.5"/>
      <!-- Router crossing arrows on top -->
      <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-18" y1="-4" x2="18" y2="4"/>
        <line x1="-18" y1="4" x2="18" y2="-4"/>
        <polyline points="-12,-8 -18,-4 -12,0"/>
        <polyline points="12,8 18,4 12,0"/>
        <polyline points="-12,8 -18,4 -12,0"/>
        <polyline points="12,-8 18,-4 12,0"/>
      </g>
      <!-- Router Name on front -->
      <text x="0" y="16" fill="#ffffff" font-size="18" font-family="'Arial Black', Arial, sans-serif" font-weight="900" text-anchor="middle">r2</text>
    </g>
    
  
    <g transform="translate(1040, 260)" filter="url(#drop-shadow)">
      <!-- Cylinder side (body) -->
      <path d="M -43.0 0 L -43.0 20 A 43.0 20.0 0 0 0 43.0 20 L 43.0 0 Z" fill="#0052a3" stroke="#003366" stroke-width="1.5"/>
      <!-- Cylinder top ellipse -->
      <ellipse cx="0" cy="0" rx="43.0" ry="20.0" fill="#1a75ff" stroke="#003366" stroke-width="1.5"/>
      <!-- Router crossing arrows on top -->
      <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-18" y1="-4" x2="18" y2="4"/>
        <line x1="-18" y1="4" x2="18" y2="-4"/>
        <polyline points="-12,-8 -18,-4 -12,0"/>
        <polyline points="12,8 18,4 12,0"/>
        <polyline points="-12,8 -18,4 -12,0"/>
        <polyline points="12,-8 18,-4 12,0"/>
      </g>
      <!-- Router Name on front -->
      <text x="0" y="16" fill="#ffffff" font-size="18" font-family="'Arial Black', Arial, sans-serif" font-weight="900" text-anchor="middle">rext</text>
    </g>
    

  <!-- Interface / IP Boxes -->
  <!-- r1 eth0 (towards A) -->
  
    <g transform="translate(330, 230)">
      <rect x="0" y="0" width="46" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="0" y1="17" x2="46" y2="17" stroke="#000000" stroke-width="1"/>
      <text x="23" y="13" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1</text>
      <text x="23" y="30" fill="#000000" font-size="12" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">eth0</text>
    </g>
    
  <!-- r1 eth1 (towards B) -->
  
    <g transform="translate(440, 290)">
      <rect x="0" y="0" width="46" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="0" y1="17" x2="46" y2="17" stroke="#000000" stroke-width="1"/>
      <text x="23" y="13" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1</text>
      <text x="23" y="30" fill="#000000" font-size="12" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">eth1</text>
    </g>
    

  <!-- r2 eth0 (towards B) -->
  
    <g transform="translate(600, 363)">
      <rect x="0" y="0" width="46" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="0" y1="17" x2="46" y2="17" stroke="#000000" stroke-width="1"/>
      <text x="23" y="13" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">2</text>
      <text x="23" y="30" fill="#000000" font-size="12" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">eth0</text>
    </g>
    
  <!-- r2 eth1 (towards C) -->
  
    <g transform="translate(745, 363)">
      <rect x="0" y="0" width="46" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="0" y1="17" x2="46" y2="17" stroke="#000000" stroke-width="1"/>
      <text x="23" y="13" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">1</text>
      <text x="23" y="30" fill="#000000" font-size="12" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">eth1</text>
    </g>
    

  <!-- rext eth0 (towards C) -->
  
    <g transform="translate(960, 290)">
      <rect x="0" y="0" width="46" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="0" y1="17" x2="46" y2="17" stroke="#000000" stroke-width="1"/>
      <text x="23" y="13" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">2</text>
      <text x="23" y="30" fill="#000000" font-size="12" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">eth0</text>
    </g>
    

  <!-- Legend in bottom right (Identical to slide 8) -->
  <g transform="translate(980, 500)">
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#fff7d6" stroke="#555555" stroke-width="2"/>
    <rect x="3" y="3" width="234" height="144" rx="6" fill="none" stroke="#555555" stroke-width="1"/>
    <text x="120" y="24" fill="#000000" font-size="15" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">legend</text>
    
    <text x="120" y="48" fill="#000000" font-size="13" font-family="Arial, sans-serif">last byte of ip address</text>
    
    <!-- Legend box sample -->
    <rect x="75" y="65" width="46" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <line x1="75" y1="82" x2="121" y2="82" stroke="#000000" stroke-width="1"/>
    <text x="98" y="78" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">ip</text>
    <text x="98" y="95" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">dev</text>

    <!-- Curved pointer lines -->
    <path d="M 115 52 C 105 56, 100 60, 98 64" fill="none" stroke="#000000" stroke-width="1"/>
    <polygon points="98,64 96,60 101,60" fill="#000000"/>

    <path d="M 80 120 C 70 115, 68 100, 74 92" fill="none" stroke="#000000" stroke-width="1"/>
    <polygon points="74,92 70,95 72,90" fill="#000000"/>
    <text x="120" y="125" fill="#000000" font-size="13" font-family="Arial, sans-serif">network interface</text>
  </g>

  <!-- Slide Footer -->
  
    <text x="30" y="695" fill="#666666" font-size="11" font-family="Arial, sans-serif">© Computer Networks Research Group<tspan x="30" dy="14">Roma Tre University</tspan></text>
    <text x="640" y="700" fill="#000000" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">kathara – [ lab: rip_frr ]</text>
    <text x="1250" y="700" fill="#000000" font-size="12" font-family="Arial, sans-serif" text-anchor="end">last update: Oct 2023</text>
    
</svg>