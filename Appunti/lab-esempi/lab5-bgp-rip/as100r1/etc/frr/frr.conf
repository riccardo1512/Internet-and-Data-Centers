!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  RIP CONFIGURATION - Interno all AS
!
router rip
    network 100.1.0.0/16
    redistribute bgp
    ! redistribute connected
!
!  BGP CONFIGURATION - Esterno verso ISP 1
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 100
    ! no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 11.0.0.1 remote-as 10
    neighbor 11.0.0.1 description Router as10r1 - AS 10
    neighbor 11.0.0.1 prefix-list mineOutOnly out
    neighbor 11.0.0.1 prefix-list defaultIn in
    !
    ! NETWORKS - Annuncia aggregato per backup + prima meta /17 per ingress primario
    !
    network 100.1.0.0/16
    network 100.1.0.0/17
!
! POLICIES
!
ip prefix-list mineOutOnly permit 100.1.0.0/16
ip prefix-list mineOutOnly permit 100.1.0.0/17
ip prefix-list defaultIn permit 0.0.0.0/0
