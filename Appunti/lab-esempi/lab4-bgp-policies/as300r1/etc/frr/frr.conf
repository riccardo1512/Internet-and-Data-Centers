!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 300
    ! no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 11.0.0.6 remote-as 200
    neighbor 11.0.0.6 description Router as200r2
    neighbor 11.0.0.6 prefix-list defaultIn in
    neighbor 11.0.0.6 prefix-list mineOutOnly out
    !
    ! NETWORKS
    !
    network 200.3.1.0/24
!
! POLICIES
!
ip prefix-list defaultIn permit 0.0.0.0/0
ip prefix-list mineOutOnly permit 200.3.1.0/24
