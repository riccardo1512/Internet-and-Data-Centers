!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 200
    ! no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS (iBGP con as200r1)
    !
    neighbor 200.2.0.1 remote-as 200
    neighbor 200.2.0.1 description Router as200r1 (iBGP)
    neighbor 200.2.0.1 next-hop-self
    !
    ! NEIGHBORS (eBGP con AS 300)
    !
    neighbor 11.0.0.5 remote-as 300
    neighbor 11.0.0.5 description Router as300r1 (eBGP)
    neighbor 11.0.0.5 prefix-list customerIn in
    neighbor 11.0.0.5 route-map tuneOut out
    !
    ! NETWORKS
    !
    network 200.2.0.0/30
!
! POLICIES
!
! Prefix-List: accetta dal cliente solo le sue subnet appartenenti a 200.3.0.0/16
ip prefix-list customerIn permit 200.3.0.0/16 le 24
!
! Route-Map Outbound: imposta MED=50 e allunga il percorso con AS-Path Prepending
route-map tuneOut permit 10
    set metric 50
    set as-path prepend 200 200
