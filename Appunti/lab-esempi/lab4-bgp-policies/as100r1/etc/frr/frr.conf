!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 100
    ! no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 11.0.0.2 remote-as 200
    neighbor 11.0.0.2 description Router as200r1
    neighbor 11.0.0.2 default-originate
    neighbor 11.0.0.2 prefix-list defaultOut out
    !
    ! NETWORKS
    !
    network 100.1.0.0/24
!
! POLICIES
!
ip prefix-list defaultOut permit 0.0.0.0/0
ip prefix-list defaultOut permit 100.1.0.0/24
