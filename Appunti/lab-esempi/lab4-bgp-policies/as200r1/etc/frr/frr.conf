!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 200
    ! no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS (eBGP con AS 100)
    !
    neighbor 11.0.0.1 remote-as 100
    neighbor 11.0.0.1 description Router as100r1 (eBGP)
    neighbor 11.0.0.1 filter-list as100In in
    neighbor 11.0.0.1 route-map setPrefIn in
    !
    ! NEIGHBORS (iBGP con as200r2)
    !
    neighbor 200.2.0.2 remote-as 200
    neighbor 200.2.0.2 description Router as200r2 (iBGP)
    neighbor 200.2.0.2 next-hop-self
    !
    ! NETWORKS
    !
    network 200.2.0.0/30
!
! POLICIES
!
! AS-Path Filter: accetta solo rotte che provengono direttamente da AS 100 (^100_)
bgp as-path access-list as100In permit ^100_
bgp as-path access-list as100In permit ^100$
!
! Route-Map: alza la Local Preference per favorire questo ingresso
route-map setPrefIn permit 10
    set local-preference 150
