!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  INTERFACES
!
interface eth1
    ospf cost 10
!
!  OSPF CONFIGURATION (Interno all'AS)
!
router ospf
    network 10.0.0.0/16 area 0.0.0.0
    ! Inietta la default route verso tutti i router OSPF interni (comando ufficiale Kathará)
    default-information originate always
    ! redistribute connected
!
!  BGP CONFIGURATION (Esterno verso ISP)
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 100
    ! no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 11.0.0.1 remote-as 10
    neighbor 11.0.0.1 description Router as10r1 (AS 10)
    neighbor 11.0.0.1 prefix-list mineOnly out
    neighbor 11.0.0.1 prefix-list defaultIn in
    !
    ! NETWORKS (Annuncia l'intero prefisso aziendale AS 100 su Internet)
    !
    network 10.0.0.0/16
!
! POLICIES
!
ip prefix-list mineOnly permit 10.0.0.0/16
ip prefix-list defaultIn permit 0.0.0.0/0
