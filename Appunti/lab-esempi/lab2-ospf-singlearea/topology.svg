<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#ffffff;">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Kathara Logo -->
  
    <g transform="translate(30, 30)">
      <!-- Blue cube -->
      <polygon points="30,0 55,12 30,24 5,12" fill="#5dade2" stroke="#1b4f72" stroke-width="1.5"/>
      <polygon points="5,12 30,24 30,50 5,38" fill="#2e86c1" stroke="#1b4f72" stroke-width="1.5"/>
      <polygon points="30,24 55,12 55,38 30,50" fill="#1b4f72" stroke="#1b4f72" stroke-width="1.5"/>
      <!-- Orange cube -->
      <polygon points="68,14 82,21 68,28 54,21" fill="#f5b041" stroke="#b9770e" stroke-width="1.2"/>
      <polygon points="54,21 68,28 68,43 54,36" fill="#e59866" stroke="#b9770e" stroke-width="1.2"/>
      <polygon points="68,28 82,21 82,36 68,43" fill="#b9770e" stroke="#b9770e" stroke-width="1.2"/>
      <!-- Yellow cube -->
      <polygon points="20,44 40,54 20,64 0,54" fill="#f9e79f" stroke="#b7950b" stroke-width="1.5"/>
      <polygon points="0,54 20,64 20,84 0,74" fill="#f7dc6f" stroke="#b7950b" stroke-width="1.5"/>
      <polygon points="20,64 40,54 40,74 20,84" fill="#d4ac0d" stroke="#b7950b" stroke-width="1.5"/>
      <!-- Green cube -->
      <polygon points="56,38 80,50 56,62 32,50" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>
      <polygon points="32,50 56,62 56,86 32,74" fill="#7dcea0" stroke="#1e8449" stroke-width="1.5"/>
      <polygon points="56,62 80,50 80,74 56,86" fill="#229954" stroke="#1e8449" stroke-width="1.5"/>
    </g>
    

  <!-- Title in red -->
  <text x="480" y="85" fill="#ff0000" font-size="46" font-family="Arial, sans-serif" font-weight="normal">lab topology</text>

  <!-- Light Green Area Cloud (identical to slide 6) -->
  <path d="M 220 370 
           C 160 220, 340 170, 520 170 
           C 660 150, 840 170, 980 200 
           C 1120 260, 1140 460, 1040 550 
           C 920 640, 680 660, 480 630 
           C 280 600, 180 500, 220 370 Z" 
        fill="#cbf78a" fill-opacity="0.85" stroke="none"/>

  <!-- Area Badge (Black pill with 0.0.0.0) -->
  <g transform="translate(200, 300)">
    <rect x="0" y="0" width="110" height="42" rx="8" fill="#000000"/>
    <text x="55" y="28" fill="#ffffff" font-size="20" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">0.0.0.0</text>
  </g>

  <!-- Area ID label -->
  <g transform="translate(170, 520)">
    <rect x="0" y="0" width="110" height="34" rx="6" fill="#000000"/>
    <text x="55" y="23" fill="#ffffff" font-size="16" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">Area ID</text>
  </g>

  <!-- Link Lines (Solid thick black lines) -->
  <!-- Top link LAN B between bb0 and bb1 -->
  <line x1="390" y1="260" x2="640" y2="260" stroke="#000000" stroke-width="3.5"/>
  <line x1="640" y1="260" x2="890" y2="260" stroke="#000000" stroke-width="3.5"/>

  <!-- LAN A connects bb0, bb1 and bb2 -->
  <line x1="390" y1="260" x2="640" y2="400" stroke="#000000" stroke-width="3.5"/>
  <line x1="890" y1="260" x2="640" y2="400" stroke="#000000" stroke-width="3.5"/>
  <line x1="640" y1="400" x2="640" y2="520" stroke="#000000" stroke-width="3.5"/>

  <!-- bb2 to LAN C -->
  <line x1="640" y1="520" x2="900" y2="520" stroke="#000000" stroke-width="3.5"/>

  <!-- Dashed lines connecting subnet boxes to collision domains -->
  <line x1="640" y1="200" x2="640" y2="240" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="530" y1="400" x2="620" y2="400" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="900" y1="460" x2="900" y2="500" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Subnet Boxes -->
  
    <g transform="translate(570, 180)">
      <rect x="0" y="0" width="119" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="59.5" y="18" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">10.0.1.0/24</text>
    </g>
    
  
    <g transform="translate(410, 387)">
      <rect x="0" y="0" width="119" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="59.5" y="18" fill="#000000" font-size="13" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">10.0.0.0/24</text>
