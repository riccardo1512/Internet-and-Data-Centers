!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  INTERFACES
!
interface eth0
    ospf cost 10
interface eth1
    ospf cost 10
!
!  OSPF CONFIGURATION - ABR tra Backbone e Stub Area 1.1.1.1
!
router ospf
    network 10.0.1.0/24 area 0.0.0.0
    network 100.1.0.0/24 area 1.1.1.1
    ! Dichiara l area come Stub: genera in automatico la default Type 3 verso as100r3
    area 1.1.1.1 stub
    ! area 1.1.1.1 stub no-summary    # Decommentare per Totally Stubby Area: blocca anche LSA 3 delle altre aree
    ! redistribute connected
