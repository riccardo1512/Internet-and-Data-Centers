!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  RIP CONFIGURATION - Interno all AS
!
router rip
    network 2.0.0.0/24
    redistribute bgp
    ! redistribute connected
!
!  BGP CONFIGURATION - Esterno verso ISP 1
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 2
    no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !

    neighbor 2.0.0.13 remote-as 2
    neighbor 2.0.0.13 description Router as2r1
    neighbor 2.0.0.13 next-hop-self

    neighbor 20.0.0.18 remote-as 3
    neighbor 20.0.0.18 description Router as3r2


    !
    ! NETWORKS
    !
    network 2.0.0.0/8
    network 20.0.0.16/30
!
! POLICIES
!