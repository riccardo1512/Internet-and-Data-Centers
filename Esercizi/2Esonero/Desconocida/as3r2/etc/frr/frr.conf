!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  RIP CONFIGURATION - Interno all AS
!
router rip
    network 3.0.0.0/8
    redistribute bgp
    ! redistribute connected
!
!  BGP CONFIGURATION - Esterno verso ISP 1
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 3
    no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 20.0.0.17 remote-as 2
    neighbor 20.0.0.17 description Router as2r2

    neighbor 3.0.0.1 remote-as 3
    neighbor 3.0.0.1 description Router as3r1
    neighbor 3.0.0.1 next-hop-self


    !
    ! NETWORKS
    !
    network 3.0.0.0/24
    network 3.1.0.0/24
    network 3.2.0.0/24
    network 20.0.0.16/30
!
! POLICIES
!
