!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 200
    no bgp ebgp-requires-policy
    ! no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 50.200.20.2 remote-as 20
    neighbor 50.200.20.2 description Router r20

    neighbor 110.200.0.3 remote-as 10
    neighbor 110.200.0.3 description Router r10


    neighbor 50.200.20.2 prefix-list mineOutOnly out
    neighbor 110.200.0.3 prefix-list mineOutOnly out
    !
    ! NETWORKS
    !
    network 200.200.0.0/16
    network 110.200.0.0/24
    network 50.200.20.0/24
!
! POLICIES
!
ip prefix-list mineOutOnly permit 200.200.0.0/16
ip prefix-list mineOutOnly permit 110.200.0.0/24
