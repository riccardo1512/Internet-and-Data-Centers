!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 10
    no bgp ebgp-requires-policy
    ! no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 50.10.1.2 remote-as 1
    neighbor 50.10.1.2 description Router r1

    neighbor 110.200.0.1 remote-as 200
    neighbor 110.200.0.1 description Router r200

    neighbor 50.100.10.4 remote-as 100
    neighbor 50.100.10.4 description Router r100


    neighbor 50.10.1.2 prefix-list mineOutOnly out
    neighbor 110.200.0.1 prefix-list mineOutOnly out
    !
    ! NETWORKS
    !
    network 100.10.0.0/16
    network 50.10.1.0/24
    network 110.200.0.0/24
    network 50.100.10.0/24
!
! POLICIES
!
ip prefix-list mineOutOnly permit 100.10.0.0/16
ip prefix-list mineOutOnly permit 50.100.10.0/24
ip prefix-list mineOutOnly permit 100.100.0.0/16
ip prefix-list mineOutOnly permit 110.200.0.0/24
