!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 4
    no bgp ebgp-requires-policy
    ! no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 10.1.4.1 remote-as 1
    neighbor 10.1.4.1 description Router as1r1

    neighbor 10.1.5.1 remote-as 1
    neighbor 10.1.5.1 description Router as1r3

    neighbor 10.2.4.1 remote-as 2
    neighbor 10.2.4.1 description Router as2r1

    neighbor 10.1.4.1 prefix-list mineOutOnly out
    neighbor 10.1.5.1 prefix-list mineOutOnly out
    neighbor 10.2.4.1 prefix-list mineOutOnly out

    neighbor 10.1.5.1 route-map setPrefIn in
    neighbor 10.1.5.1 route-map tuneOut out

    neighbor 10.1.4.1 filter-list noPeerIn in
    neighbor 10.1.5.1 filter-list noPeerIn in

    !
    ! NETWORKS
    !
    network 10.2.4.0/30
    network 10.1.4.0/30
    network 10.1.5.0/30
    network 4.0.0.0/24
!
! POLICIES
!
ip prefix-list mineOutOnly permit 4.0.0.0/24
ip prefix-list mineOutOnly permit 10.2.4.0/30

route-map setPrefIn permit 10
    set local-preference 90

access-list myAggregate permit 4.0.0.0/24
access-list myAggregate permit 10.2.4.0/30

route-map tuneOut permit 10
    match ip address myAggregate
    ! match ip address mineOutOnly
    set metric 50

bgp as-path access-list noPeerIn deny _2$   
bgp as-path access-list noPeerIn deny _3$
bgp as-path access-list noPeerIn permit .*
! bgp as-path access-list noPeerIn deny _2_