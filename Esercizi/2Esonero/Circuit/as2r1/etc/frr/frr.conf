!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 2
    no bgp ebgp-requires-policy
    ! no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 10.1.2.1 remote-as 1
    neighbor 10.1.2.1 description Router as1r1

    neighbor 10.2.4.2 remote-as 4
    neighbor 10.2.4.2 description Router as4r1

    neighbor 10.2.3.2 remote-as 3
    neighbor 10.2.3.2 description Router as3r1

    neighbor 10.1.2.1 prefix-list mineOutOnly out
    neighbor 10.2.4.2 prefix-list mineOutOnly out
    !
    ! NETWORKS
    !
    network 10.1.2.0/30
    network 10.2.4.0/30
    network 10.2.3.0/30
    network 2.0.0.0/24
!
! POLICIES
!
ip prefix-list mineOutOnly permit 2.0.0.0/24
ip prefix-list mineOutOnly permit 10.2.3.0/30
ip prefix-list mineOutOnly permit 3.0.0.0/8
ip prefix-list mineOutOnly permit 10.2.4.0/30