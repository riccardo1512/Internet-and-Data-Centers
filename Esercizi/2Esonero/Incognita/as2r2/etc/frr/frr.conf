!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  RIP CONFIGURATION
!
router rip
    network 2.0.0.0/24
    redistribute bgp
    ! redistribute connected
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 2
    no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 2.0.0.1 remote-as 2
    neighbor 2.0.0.1 description Router as2r1
    neighbor 2.0.0.1 next-hop-self
    neighbor 20.0.0.22 remote-as 3
    neighbor 20.0.0.22 description Router as3r2

    neighbor 20.0.0.22 prefix-list denyEIn in
    !
    ! NETWORKS
    !
    network 20.0.0.20/30
    network 2.0.0.0/8
!
! POLICIES
!
ip prefix-list denyEIn deny 3.2.0.0/24
ip prefix-list denyEIn permit any
