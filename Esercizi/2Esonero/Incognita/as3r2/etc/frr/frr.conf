!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  RIP CONFIGURATION
!
router rip
    network 3.0.0.0/8
    redistribute bgp
    ! redistribute connected
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 3
    no bgp ebgp-requires-policy
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 20.0.0.21 remote-as 2
    neighbor 20.0.0.21 description Router as2r2
    neighbor 3.0.0.1 remote-as 3
    neighbor 3.0.0.1 description Router as3r1
    neighbor 3.0.0.1 next-hop-self

    neighbor 20.0.0.21 prefix-list denyAS1 in

    !
    ! NETWORKS
    !
    network 20.0.0.20/30
    network 3.0.0.0/24
    network 3.1.0.0/24
    network 3.2.0.0/24
!
! POLICIES
!
ip prefix-list denyAS1 deny 1.0.0.0/8
ip prefix-list denyAS1 permit any
